<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Control Panel</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary: #bb86fc;
            --on-primary: #000000;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --danger: #cf6679;
        }

        body {
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .app-shell {
            position: relative;
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            padding-top: 2rem;
        }

        .control-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
        }

        .container {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            margin-bottom: 2rem;
            justify-items: center;
        }

        .btn {
            background-color: #333333;
            color: var(--text);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
            background-color: var(--primary);
            color: var(--on-primary);
        }

        .btn.empty {
            visibility: hidden;
        }

        .btn-up {
            grid-column: 2;
            grid-row: 1;
        }

        .btn-left {
            grid-column: 1;
            grid-row: 2;
        }

        .btn-down {
            grid-column: 2;
            grid-row: 2;
        }

        .btn-right {
            grid-column: 3;
            grid-row: 2;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .actions .btn {
            background-color: var(--primary);
            color: var(--on-primary);
            font-weight: bold;
        }

        .actions .btn-land {
            background-color: var(--danger);
            color: #ffffff;
        }

        .actions .btn-stop {
            background-color: #ff1744;
            color: #ffffff;
        }

        .status {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            min-height: 20px;
            text-align: left;
            line-height: 1.35;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .telemetry-row {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
        }

        .telemetry-label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.72rem;
            margin-bottom: 2px;
        }

        .telemetry-value {
            color: var(--text);
            font-weight: 600;
        }

        .telemetry-wide {
            grid-column: 1 / -1;
        }

        .throttle-panel {
            background-color: #333333;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            width: 112px;
            z-index: 10;
            flex: 0 0 auto;
        }

        .throttle-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: block;
            text-align: center;
        }

        .throttle-label strong {
            color: var(--primary);
        }

        .throttle-controls {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .throttle-arrow {
            width: 72px;
            height: 48px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .throttle-scale {
            width: 36px;
        }

        .throttle-ticks {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
            pointer-events: none;
        }

        .throttle-tick {
            width: 100%;
            height: 10px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .throttle-tick.active {
            background: #39d353;
            border-color: #6ee787;
            box-shadow: 0 0 8px rgba(57, 211, 83, 0.85);
        }

        @media (min-width: 800px) {
            .programs-panel {
                position: absolute;
                left: 0;
                top: 2rem;
                margin: 0;
            }
        }

        @media (max-width: 799px) {
            .app-shell {
                padding-top: 0;
            }

            .control-layout {
                flex-direction: column;
            }

            .programs-panel {
                position: static;
                margin-bottom: 1.5rem;
            }

            .air-quality-panel {
                position: static;
                margin-bottom: 1.5rem;
                width: 100%;
            }
        }

        @media (min-width: 800px) {
            .air-quality-panel {
                position: absolute;
                left: 0;
                bottom: 2rem;
                top: auto;
                margin: 0;
                width: 300px;
                box-sizing: border-box;
            }
        }

        @media (max-width: 979px) {
            .throttle-panel {
                width: 96px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-shell">
        <div class="container programs-panel" style="max-width: 300px;">
            <h2 style="margin-top: 0; margin-bottom: 0.5rem; font-size: 1.5rem;">Programs</h2>
            <p>Automated flight sequences</p>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button class="btn" style="background-color: #03dac6; color: #000;" onclick="flySquare()">Square
                    (5s)</button>
            </div>
        </div>

        <div class="container air-quality-panel" style="padding: 1.5rem;">
            <h2 style="margin-top: 0; margin-bottom: 0.5rem; font-size: 1.2rem;">Air Quality</h2>
            <div style="position: relative; height: 180px; width: 100%;">
                <canvas id="aqiChart"></canvas>
            </div>
        </div>

        <div class="control-layout">
            <div class="container">
                <h1>Drone Flight Control</h1>
                <p>Send commands to HC-05 via Bluetooth</p>

                <div class="d-pad">
                    <div class="btn empty"></div>
                    <button class="btn btn-up" onpointerdown="sendCommand('forward', 2.0)"
                        onpointerup="sendCommand('stop_pitch', 0.0)"
                        onpointerleave="sendCommand('stop_pitch', 0.0)">W</button>
                    <div class="btn empty"></div>
                    <button class="btn btn-left" onpointerdown="sendCommand('left', 2.0)"
                        onpointerup="sendCommand('stop_roll', 0.0)"
                        onpointerleave="sendCommand('stop_roll', 0.0)">A</button>
                    <button class="btn btn-down" onpointerdown="sendCommand('backward', 2.0)"
                        onpointerup="sendCommand('stop_pitch', 0.0)"
                        onpointerleave="sendCommand('stop_pitch', 0.0)">S</button>
                    <button class="btn btn-right" onpointerdown="sendCommand('right', 2.0)"
                        onpointerup="sendCommand('stop_roll', 0.0)"
                        onpointerleave="sendCommand('stop_roll', 0.0)">D</button>
                </div>

                <div class="actions">
                    <button class="btn" onclick="sendTakeoff()">Takeoff</button>
                    <button class="btn btn-land" onclick="sendCommand('land', 0.0)">Land</button>
                    <button class="btn btn-stop" onclick="sendStop()">Stop</button>
                </div>

                <div class="status" id="status-msg">Idle.</div>
            </div>

            <div class="throttle-panel">
                <label class="throttle-label" for="throttle">Throttle (0-1000): <strong
                        id="throttle-val">0</strong></label>
                <div class="throttle-controls">
                    <button class="btn throttle-arrow" type="button" onclick="adjustThrottle(50)">&#9650;</button>
                    <div class="throttle-scale">
                        <input type="hidden" id="throttle" name="throttle" value="0">
                        <div class="throttle-ticks" id="throttle-ticks" aria-hidden="true"></div>
                    </div>
                    <button class="btn throttle-arrow" type="button" onclick="adjustThrottle(-50)">&#9660;</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const THROTTLE_MIN = 0;
        const THROTTLE_MAX = 1000;
        const THROTTLE_STEP = 50;
        const TAKEOFF_THROTTLE_MIN = 250;

        function clampThrottle(value) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) {
                return THROTTLE_MIN;
            }

            return Math.min(
                THROTTLE_MAX,
                Math.max(THROTTLE_MIN, Math.round(numericValue / THROTTLE_STEP) * THROTTLE_STEP)
            );
        }

        function updateThrottleUI(value) {
            const clampedValue = clampThrottle(value);
            const throttleInput = document.getElementById('throttle');
            const throttleValue = document.getElementById('throttle-val');

            if (throttleInput) {
                throttleInput.value = clampedValue;
            }

            if (throttleValue) {
                throttleValue.textContent = clampedValue;
            }

            document.querySelectorAll('#throttle-ticks .throttle-tick').forEach((tick, index, ticks) => {
                const tickValue = (ticks.length - 1 - index) * THROTTLE_STEP;
                tick.classList.toggle('active', tickValue <= clampedValue);
            });

            return clampedValue;
        }

        async function setThrottle(value) {
            const clampedValue = updateThrottleUI(value);
            await sendCommand('throttle', clampedValue);
        }

        function adjustThrottle(delta) {
            const throttleInput = document.getElementById('throttle');
            const currentValue = throttleInput ? Number(throttleInput.value) : THROTTLE_MIN;
            setThrottle(currentValue + delta);
        }

        async function sendTakeoff() {
            const throttleInput = document.getElementById('throttle');
            const currentValue = throttleInput ? Number(throttleInput.value) : THROTTLE_MIN;
            const clampedValue = updateThrottleUI(Math.max(currentValue, TAKEOFF_THROTTLE_MIN));
            await sendCommand('takeoff', clampedValue);
        }

        async function sendStop() {
            updateThrottleUI(THROTTLE_MIN);
            await sendCommand('stop', 0.0);
        }

        function renderThrottleTicks() {
            const throttleTicks = document.getElementById('throttle-ticks');
            if (!throttleTicks) {
                return;
            }

            throttleTicks.innerHTML = '';
            for (let value = THROTTLE_MAX; value >= THROTTLE_MIN; value -= THROTTLE_STEP) {
                const tick = document.createElement('div');
                tick.className = 'throttle-tick';
                throttleTicks.appendChild(tick);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderThrottleTicks();
            updateThrottleUI(THROTTLE_MIN);
        });

        function formatFixed(value, digits = 1) {
            const numericValue = Number(value);
            return Number.isFinite(numericValue) ? numericValue.toFixed(digits) : '--';
        }

        function formatInt(value) {
            const numericValue = Number(value);
            return Number.isFinite(numericValue) ? Math.round(numericValue).toString() : '--';
        }

        function escapeHtml(value) {
            return String(value ?? '--')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function telemetryCell(label, value, wide = false) {
            return `
                <div class="telemetry-row${wide ? ' telemetry-wide' : ''}">
                    <span class="telemetry-label">${escapeHtml(label)}</span>
                    <span class="telemetry-value">${escapeHtml(value)}</span>
                </div>
            `;
        }

        function renderTelemetry(data) {
            const motors = data.motors || {};
            const loop = data.loop || {};
            const link = [
                `PC ${data.serial_connected ? 'open' : 'closed'}`,
                `BT ${data.bluetooth_connected ? 'yes' : 'no'}`,
                data.serial_last_rx_age_ms !== undefined && data.serial_last_rx_age_ms !== null
                    ? `${data.serial_last_rx_age_ms}ms RX`
                    : 'no RX'
            ].join(' | ');

            return `
                <div class="telemetry-grid">
                    ${telemetryCell('State', data.status || 'Idle')}
                    ${telemetryCell('Link', link)}
                    ${telemetryCell('Setpoint', `thr ${formatInt(data.throttle_us)}us | R ${formatFixed(data.target_roll)} | P ${formatFixed(data.target_pitch)} | Y ${formatFixed(data.target_yaw)}`, true)}
                    ${telemetryCell('IMU', `R ${formatFixed(data.roll)}deg | P ${formatFixed(data.pitch)}deg | Y ${formatFixed(data.yaw)}deg`, true)}
                    ${telemetryCell('Motors', `M1 ${formatInt(motors.m1)} | M2 ${formatInt(motors.m2)} | M3 ${formatInt(motors.m3)} | M4 ${formatInt(motors.m4)}`, true)}
                    ${telemetryCell('Loop', `avg ${formatInt(loop.avg_us)}us | min ${formatInt(loop.min_us)} | max ${formatInt(loop.max_us)}`, true)}
                    ${data.serial_error ? telemetryCell('Serial Error', data.serial_error, true) : ''}
                    ${data.last_message ? telemetryCell('Message', data.last_message, true) : ''}
                </div>
            `;
        }

        // Poll for drone status at a readable pace
        setInterval(async () => {
            try {
                const response = await fetch('/api/status');
                if (response.ok) {
                    const data = await response.json();
                    const statusEl = document.getElementById('status-msg');

                    // Format the telemetry data into a readable string
                    let uiString = `Drone: ${data.status || 'Idle'}`;
                    if (data.serial_port) uiString += ` | Port: ${data.serial_port}`;
                    if (data.serial_port_reason) uiString += ` | Port Info: ${data.serial_port_reason}`;
                    if (data.serial_connected !== undefined) uiString += ` | PC Serial: ${data.serial_connected ? 'open' : 'closed'}`;
                    if (data.link_verified !== undefined) uiString += ` | Link Verified: ${data.link_verified ? 'yes' : 'no'}`;
                    if (data.bluetooth_connected !== undefined) uiString += ` | Drone BT: ${data.bluetooth_connected ? 'yes' : 'no'}`;
                    if (data.serial_last_rx_age_ms !== undefined && data.serial_last_rx_age_ms !== null) uiString += ` | Last RX: ${data.serial_last_rx_age_ms}ms ago`;
                    if (data.serial_error) uiString += ` | Serial Error: ${data.serial_error}`;
                    if (data.connection_note) uiString += ` | Note: ${data.connection_note}`;
                    if (data.target_pitch !== undefined) uiString += ` | Cmd Pitch: ${data.target_pitch}°`;
                    if (data.target_roll !== undefined) uiString += ` | Cmd Roll: ${data.target_roll}°`;
                    if (data.pitch !== undefined) uiString += ` | True Pitch: ${parseFloat(data.pitch).toFixed(1)}°`;
                    if (data.battery) uiString += ` | Battery: ${data.battery}%`;
                    if (data.altitude) uiString += ` | Alt: ${data.altitude}m`;
                    if (data.last_message) uiString += ` | Msg: ${data.last_message}`;

                    // Revert to displaying telemetry after 3 seconds of showing success/error messages
                    if (statusEl.getAttribute('data-temp-msg') !== "true") {
                        statusEl.innerHTML = renderTelemetry(data);
                        statusEl.style.color = "var(--text-secondary)";
                    }
                }
            } catch (err) { }
        }, 2000);

        async function sendCommand(action, value) {
            const statusEl = document.getElementById('status-msg');
            statusEl.textContent = `Sending ${action}...`;
            statusEl.style.color = "var(--text-secondary)";
            statusEl.setAttribute('data-temp-msg', "true");

            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, value })
                });

                const result = await response.json();

                if (response.ok) {
                    statusEl.textContent = `Success: ${result.message}`;
                    statusEl.style.color = "var(--primary)";
                } else {
                    statusEl.textContent = `Error: ${result.message}`;
                    statusEl.style.color = "var(--danger)";
                }
            } catch (error) {
                statusEl.textContent = 'Server not reachable.';
                statusEl.style.color = "var(--danger)";
            }

            // Remove the temp message lock after a few seconds so polling resumes
            setTimeout(() => { statusEl.setAttribute('data-temp-msg', "false"); }, 3000);
        }

        async function flySquare() {
            const sideDuration = 1250; // 1.25 seconds per side

            // Forward
            await sendCommand('forward', 2.0);
            await new Promise(r => setTimeout(r, sideDuration));
            await sendCommand('stop_pitch', 0.0);

            // Right
            await sendCommand('right', 2.0);
            await new Promise(r => setTimeout(r, sideDuration));
            await sendCommand('stop_roll', 0.0);

            // Backward
            await sendCommand('backward', 2.0);
            await new Promise(r => setTimeout(r, sideDuration));
            await sendCommand('stop_pitch', 0.0);

            // Left
            await sendCommand('left', 2.0);
            await new Promise(r => setTimeout(r, sideDuration));
            await sendCommand('stop_roll', 0.0);
        }

        // Map WASD keys to drone movement
        document.addEventListener('keydown', (event) => {
            if (event.repeat) return; // Prevent spamming if key is held down
            switch (event.key.toLowerCase()) {
                case 'w': sendCommand('forward', 2.0); break;
                case 'a': sendCommand('left', 2.0); break;
                case 's': sendCommand('backward', 2.0); break;
                case 'd': sendCommand('right', 2.0); break;
            }
        });

        // Auto-level pitch/roll back to 0 the moment the user steps off the designated key
        document.addEventListener('keyup', (event) => {
            switch (event.key.toLowerCase()) {
                case 'w':
                case 's':
                    sendCommand('stop_pitch', 0.0); break;
                case 'a':
                case 'd':
                    sendCommand('stop_roll', 0.0); break;
            }
        });

        // --- Mock Air Quality Live Graph ---
        document.addEventListener('DOMContentLoaded', () => {
            const ctx = document.getElementById('aqiChart');
            if (!ctx) return;

            // Initialize chart with empty data arrays (30 points for 30 seconds)
            const maxDataPoints = 30;
            const labels = Array.from({ length: maxDataPoints }, () => '');
            const aqiData = Array.from({ length: maxDataPoints }, () => null);
            const tvocData = Array.from({ length: maxDataPoints }, () => null);

            const aqiChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'AQI (UBA)',
                            data: aqiData,
                            borderColor: '#03dac6',
                            backgroundColor: 'rgba(3, 218, 198, 0.15)',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.3
                        },
                        {
                            label: 'TVOC (ppb)',
                            data: tvocData,
                            borderColor: '#bb86fc',
                            backgroundColor: 'rgba(187, 134, 252, 0.15)',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 0 // Smooth continuous appearance
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            display: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: 'var(--text-secondary)', font: { size: 10 } },
                            suggestedMin: 0,
                            suggestedMax: 150
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: 'var(--text)',
                                font: { family: "'Inter', sans-serif", size: 11 },
                                boxWidth: 12
                            }
                        }
                    }
                }
            });

            // Base mock values
            let currentAqi = 45;
            let currentTvoc = 110;

            setInterval(() => {
                // Random walk noise
                currentAqi = Math.max(10, currentAqi + (Math.random() - 0.5) * 8);
                currentTvoc = Math.max(20, currentTvoc + (Math.random() - 0.5) * 20);

                // Add slight periodic spikes to look like sensor hits
                if (Math.random() > 0.95) {
                    currentTvoc += Math.random() * 40;
                }

                // Push new data and remove oldest
                aqiChart.data.datasets[0].data.push(currentAqi);
                aqiChart.data.datasets[0].data.shift();

                aqiChart.data.datasets[1].data.push(currentTvoc);
                aqiChart.data.datasets[1].data.shift();

                aqiChart.update();
            }, 1000); // Update every second
        });
    </script>
</body>

</html>
